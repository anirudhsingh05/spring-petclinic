version: 0.2

env:
  variables:
    DOCKER_USERNAME: "madblaze"
    GITOPS_REPO: "https://github.com/anirudhsingh05/petclinic_operations.git"
    IMAGE_NAME: "madblaze/spring-petclinic"
  parameter-store:
    DOCKER_PASSWORD: "/CodeBuild/DOCKER_PASSWORD"
    GITHUB_TOKEN: "/CodeBuild/GITHUB_TOKEN"

phases:
  install:
    runtime-versions:
      java: corretto17
  
  pre_build:
    commands:
      - echo Logging in to Docker Hub...
      - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
      
  build:
    commands:
      - echo Build started on `date`
      - ./mvnw clean package -DskipTests
      - docker build -t $IMAGE_NAME:$IMAGE_TAG .

  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker push $IMAGE_NAME:$IMAGE_TAG
      - echo Updating GitOps repository...
      - git clone https://${GITHUB_TOKEN}@github.com/anirudhsingh05/petclinic_operations.git
      - cd petclinic_operations
      - git config --global user.email "anirudhsingh05032001@gmail.com"
      - git config --global user.name "anirudhsingh05"
      - sed -i "s|image: madblaze/spring-petclinic:[^ ]*|image: madblaze/spring-petclinic:${IMAGE_TAG}|" k8s/deployment.yaml
      - git add k8s/deployment.yaml
      - |
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update image tag to ${IMAGE_TAG}"
          git push origin main
        fi

cache:
  paths:
    - '/root/.m2/**/*'
